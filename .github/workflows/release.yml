name: Release

env:
  NPM_REGISTRY: 'https://registry.npmjs.org'

run-name: |
  ${{ (inputs.dryrun && 'Dry run')
   || format('Release: {0}', (inputs.version == 'custom' && inputs.custom) || inputs.version) }}

on:
  workflow_dispatch:
    inputs:
      dryrun:
        description: 'Dry run (no npm publish)'
        required: false
        type: boolean
        default: true
      version:
        description: 'Version component to update (or "custom" to provide exact version)'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease
          - custom
      custom:
        description: 'Custom version'
        required: false
        default: ''

permissions:
  id-token: write
  contents: read

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      dryrun: ${{ steps.dryrun.outputs.dryrun }}
      publish: ${{ steps.publish.outputs.publish }}
      ref: ${{ steps.tag.outputs.tag || github.event.repository.default_branch }}
      tag: ${{ steps.tag.outputs.tag || '' }}
    steps:
      - name: Validate Workflow Inputs
        if: ${{ inputs.version == 'custom' && inputs.custom == '' }}
        shell: bash
        run: |
          echo '::error::No custom version number provided'
          exit 1
      - id: dryrun
        name: Validate Dry Run Event
        if: ${{ inputs.dryrun }}
        shell: bash
        run: echo dryrun=true | tee -a $GITHUB_OUTPUT
      - id: publish
        name: Validate Publish Event
        if: ${{ !inputs.dryrun }}
        shell: bash
        run: |
          echo publish=true | tee -a $GITHUB_OUTPUT
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Setup Neon Environment
        uses: ./.github/actions/setup
        with:
          use-rust: false
      - name: Tag Release
        if: ${{ !inputs.dryrun }}
        id: tag
        shell: bash
        run: |
          git config --global user.name $ACTIONS_USER
          git config --global user.email $ACTIONS_EMAIL
          npm version -m 'v%s' '${{ (inputs.version == 'custom' && inputs.custom) || inputs.version }}'
          git push --follow-tags
          echo tag=$(git describe --abbrev=0) | tee -a $GITHUB_OUTPUT

  build:
    name: Build
    needs: [setup]
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.setup.outputs.ref }}
      tag: ${{ needs.setup.outputs.tag }}
      update-version: ${{ !!needs.setup.outputs.dryrun }}
      version: ${{ (inputs.version == 'custom' && inputs.custom) || inputs.version }}
      github-release: ${{ !!needs.setup.outputs.publish }}

  publish:
    name: Publish
    if: ${{ needs.setup.outputs.publish }}
    needs: [setup, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for npm trusted publishing. Job level permissions replace the
      # workflow level block outright, so id-token has to be repeated here.
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          ref: ${{ needs.setup.outputs.ref }}
      # Publishing does not need the project's dependencies, but it does need a
      # newer toolchain than the build: trusted publishing requires npm 11.5.1
      # and Node 22.14.0 at minimum.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: ${{ env.NPM_REGISTRY }}
      - name: Update npm
        shell: bash
        run: npm install -g npm@latest
      - name: Fetch
        uses: robinraju/release-downloader@c39a3b234af58f0cf85888573d361fb6fa281534 # v1.10
        with:
          tag: ${{ needs.setup.outputs.tag }}
          fileName: "*.tgz"
          out-file-path: ./dist
      # No NODE_AUTH_TOKEN: authentication is the OIDC exchange, and npm
      # attaches provenance automatically when it publishes this way.
      - name: Publish
        shell: bash
        run: |
          npm --version
          version=$(node -p "require('./package.json').version")
          # npm refuses to publish a prerelease without an explicit dist-tag, so
          # that `latest` can never end up pointing at a preview build. Name the
          # tag after the prerelease identifier: 0.1.0-beta.1 publishes as beta.
          tag=latest
          if [[ "$version" == *-* ]]; then
            pre="${version#*-}"
            tag="${pre%%.*}"
            if [[ ! "$tag" =~ ^[a-z][a-z0-9-]*$ ]]; then
              tag=next
            fi
          fi
          echo "publishing $version with dist-tag $tag"
          for p in ./dist/*.tgz ; do
            npm publish --access public --tag "$tag" $p
          done
